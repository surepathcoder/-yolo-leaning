[project]
name = "visionguard"
version = "0.1.0"
description = "AI-powered CCTV, retail security and inventory intelligence platform"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["venv", ".venv", "node_modules", "backend/alembic/versions", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "N818",   # error class names do not all end in "Error"
    "RUF012", # mutable class attrs on pydantic/SQLAlchemy models
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["E501"]
"backend/alembic/env.py" = ["E402"]
"backend/tests/conftest.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app", "vision"]
