# Alembic configuration.
# The database URL is NOT stored here -- it is read from the application
# settings (and therefore from .env) in backend/alembic/env.py, so credentials
# never live in a committed file.

[alembic]
script_location = backend/alembic
prepend_sys_path = backend:.
path_separator = os
# Migration filenames are prefixed with a UTC timestamp so they sort in the
# order they were written, which makes reviewing a branch far easier.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

# Format generated migrations with ruff. `module` invokes it through the
# active interpreter, which works regardless of how ruff was installed.
[post_write_hooks]
hooks = ruff_format
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
